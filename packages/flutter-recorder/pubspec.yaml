name: kue_qa_recorder
description: Optional silent native screen recording for KUE Flutter reports on iOS and Android.
version: 0.6.0
homepage: https://github.com/Ischca/kue
repository: https://github.com/Ischca/kue
issue_tracker: https://github.com/Ischca/kue/issues
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  kue_qa: 0.6.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.kue.qa.flutter.recorder
        pluginClass: KueRecorderPlugin
      ios:
        pluginClass: KueRecorderPlugin
