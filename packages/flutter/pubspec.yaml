name: kue_qa
description: Native screenshot reporting, annotated findings, grouped feedback and delivery controls for Flutter iOS and Android apps.
version: 0.6.0
homepage: https://github.com/Ischca/kue
repository: https://github.com/Ischca/kue
issue_tracker: https://github.com/Ischca/kue/issues
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.kue.qa.flutter
        pluginClass: KuePlugin
      ios:
        pluginClass: KuePlugin
  uses-material-design: true
  assets:
    - assets/kue-mascot.png
